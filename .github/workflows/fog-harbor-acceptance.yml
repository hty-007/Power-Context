name: Fog Harbor acceptance

on:
  push:
    branches: [2026-competition-ecosystem-dify, 'dify-fog-harbor-qa-*']

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dify
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Start a clean Dify stack
        run: python3 run.py up
      - name: Import the DSL and play all routes
        run: python3 clean_acceptance.py
      - name: Capture the WebApp
        run: |
          python3 -m venv .runtime/browser
          .runtime/browser/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .runtime/browser/bin/python capture_webapp.py
      - name: Collect PowerContext revision evidence
        if: always()
        run: |
          python3 run.py status || true
          python3 run.py logs | tee powercontext.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fog-harbor-acceptance
          path: |
            dify/acceptance.local.json
            dify/powercontext.log
            dify/.runtime/screenshots/*.png
          include-hidden-files: true
          retention-days: 14
