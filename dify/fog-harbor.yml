app:
  name: 雾港留灯
  mode: advanced-chat
  icon: 🏮
  icon_background: '#FFEAD5'
  description: 轮渡即将驶进雾港。你只有一幕准备时间，而值班簿会记住你的选择。
  use_icon_as_answer_icon: true
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - id: 56fdf487-4a2c-4b2a-8fd8-57d1353112f7
    name: active_code
    description: 当前对话选用的存档码
    selector:
    - conversation
    - active_code
    value_type: string
    value: ''
  environment_variables: []
  features:
    opening_statement: |
      雾港的引航灯灭了。最后一班轮渡还在海上。

      发送 **开始** 接班，或发送 `继续 存档码` 读回值班簿。
    suggested_questions:
    - 开始
    - 怎么玩
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    file_upload:
      enabled: false
      image:
        enabled: false
  graph:
    nodes:
    - id: '1710000000001'
      type: custom
      data:
        type: start
        title: 接收玩家消息
        desc: ''
        selected: false
        variables: []
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
      selected: false
    - id: '1710000000002'
      type: custom
      data:
        type: code
        title: 识别指令
        desc: 识别开始、恢复或行动，准备存档请求。
        selected: false
        code_language: python3
        code: |
          import json
          import re
          import unicodedata


          CODE = re.compile(r"H-[0-9A-F]{24}")
          ACTIONS = {"修灯", "问潮", "送信", "引航", "放船", "开闸", "鸣铃"}


          def main(query: str, active_code: str) -> dict:
              words = unicodedata.normalize("NFKC", query[:240]).strip().split()
              active_code = active_code or ""
              command = words[0].lower() if words else ""
              explicit_code = words[1].upper() if len(words) == 2 else ""
              code = explicit_code or active_code
              action = ""
              op = "help"

              if len(words) == 1 and command in {"开始", "新游戏", "new"}:
                  op = "new"
                  code = ""
              elif len(words) <= 2 and command in {"继续", "resume"}:
                  op = "resume" if CODE.fullmatch(code) else "need_code"
              elif len(words) == 1 and CODE.fullmatch(command.upper()):
                  op = "resume"
                  code = command.upper()
              elif len(words) == 1 and command in ACTIONS:
                  op = "move" if CODE.fullmatch(code) else "need_code"
                  action = command
              elif words and command not in {"帮助", "help", "怎么玩"}:
                  op = "unknown"

              load = {"op": op}
              if op in {"resume", "move"}:
                  load["code"] = code
              return {
                  "op": op,
                  "action": action,
                  "code": code,
                  "previous_code": active_code,
                  "load_body": json.dumps(load, separators=(",", ":")),
              }
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: active_code
          value_selector:
          - conversation
          - active_code
        outputs:
          op:
            type: string
            children: null
          action:
            type: string
            children: null
          code:
            type: string
            children: null
          previous_code:
            type: string
            children: null
          load_body:
            type: string
            children: null
      position:
        x: 310
        y: 0
      positionAbsolute:
        x: 310
        y: 0
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 100
      selected: false
    - id: '1710000000003'
      type: custom
      data:
        type: http-request
        title: 读取 PowerContext 存档
        desc: 恢复和行动都会按存档码读当前 Atomic Memory。
        selected: false
        method: post
        url: http://story-memory:8079/load
        authorization:
          type: no-auth
          config: null
        headers: Content-Type:application/json
        params: ''
        variables: []
        body:
